name: Build Tool - Tester
on:
  workflow_dispatch:
    inputs:
      no-run-tool:
        description: 'Skips running of the tool'
        default: false
        required: true
        type: boolean

env:
  NODE_VERSION: "26.10.0"

jobs:
  build-tool:
    name: Build Tool
    runs-on: ubuntu-latest

    env:
      TEMPLATES:

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'client/yarn.lock'

      - name: Set CurseForge Key
        env:
          secret_set: ${{ secrets.CURSEFORGE_CODE }}
        if: ${{ env.secret_set != '' }}
        run: |
          echo '${{ secrets.CURSEFORGE_CODE }}' > config/curseforge.go

      - name: Download Go modules
        run: |
          go mod download

      - name: Generate Swagger Docs
        run: |
          go tool swag init --pd --md . -o web/swagger -g web/loader.go

      - name: yarn install, test, lint, build
        run: |
          npm install --global --allow-scripts=yarn yarn@1.22.22
          yarn install --frozen-lockfile
          yarn test
          yarn lint
          env VITE_CHECK_ENV="true" yarn build
        env:
          CI: true
        working-directory: client
          
      - name: Download APT packages
        run: |
          sudo apt-get update
          sudo apt-get install --download-only -y gcc-aarch64-linux-gnu

      - name: APT Install
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Prep
        run: |
          mkdir build-artifacts

      - name: Build AMD64
        run: |
          go build -o build-artifacts/pufferpanel_x64 -v github.com/pufferpanel/pufferpanel/v3/cmd
          go build -o build-artifacts/templatetester_x64 -v github.com/pufferpanel/pufferpanel/v3/tools/templatetester
        env:
          GOOS: linux
          GOARCH: amd64

      - name: Build ARM64
        run: |
          go build -o build-artifacts/pufferpanel_arm64 -v github.com/pufferpanel/pufferpanel/v3/cmd
          go build -o build-artifacts/templatetester_arm64 -v github.com/pufferpanel/pufferpanel/v3/tools/templatetester
        env:
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
          CGO_ENABLED: 1

      - name: Generate job artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tool-binaries
          path: build-artifacts/
          if-no-files-found: error

      - name: Get templates
        run: |
          build-artifacts/templatetester_x64 --print

      - name: Trigger tests
        id: trigger
        if: ${{ ! inputs.no-run-tool }}
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          event-type: template-tester
          client-payload: '{ "templates": [ ${{ env.TEMPLATES }} ], "run_id": "${{ github.run_id }}" }'