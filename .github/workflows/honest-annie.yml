name: honest_annie

on:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '17 4 * * *'
  workflow_run:
    workflows: [Annie PR wake]
    types: [completed]
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: offline unpaid; observe/sweep: read-only unpaid; maintain: bounded paid admission'
        type: choice
        default: check
        options: [check, observe, sweep, maintain]
      bootstrap:
        description: 'Explicit initial empty-ledger bootstrap only; never recover missing prior state this way'
        type: boolean
        default: false
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' && format('annie-check-{0}', github.run_id) || 'honest-annie-trusted' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - name: Offline tests, no observations or credentials
        run: |
          npm test
          bash -n ci.sh gate.sh harness-gate.sh publish.sh run.sh podman.sh sandbox.sh
        working-directory: tools/maintainer

  observe:
    needs: check
    if: >-
      github.repository == 'bugabinga/pufferpanel' && github.ref == 'refs/heads/trunk' &&
      !(github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      paid: ${{ steps.observe.outputs.paid }}
      task: ${{ steps.observe.outputs.task }}
      lease: ${{ steps.observe.outputs.lease }}
      retry: ${{ steps.observe.outputs.retry }}
      republish: ${{ steps.observe.outputs.republish }}
      holds: ${{ steps.observe.outputs.holds }}
      rejections: ${{ steps.observe.outputs.rejections }}
      incident: ${{ steps.observe.outputs.incident }}
      incidents: ${{ steps.observe.outputs.incidents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - name: Rediscover, verify ledger, select useful work
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          ANNIE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'maintain' }}
          HONEST_ANNIE_ENABLED: ${{ vars.HONEST_ANNIE_ENABLED }}
          ANNIE_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && github.run_id || '' }}
          ANNIE_CONFIG_REVISION: ${{ vars.ANNIE_CONFIG_REVISION }}
          ANNIE_OUTPUT_DIR: ${{ runner.temp }}/annie-observer
        run: node tools/maintainer/controller.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.run_attempt == 1
        with:
          name: annie-checkpoint-${{ github.run_id }}-1
          path: ${{ runner.temp }}/annie-observer/checkpoint.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: annie-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/annie-observer/observer.json
          if-no-files-found: warn
          retention-days: 14

  maintain:
    needs: [check, observe]
    if: >-
      github.repository == 'bugabinga/pufferpanel' && github.ref == 'refs/heads/trunk' &&
      vars.HONEST_ANNIE_ENABLED == 'true' && github.run_attempt == 1 && needs.observe.outputs.paid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    environment: honest-annie-model
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      management: ${{ steps.candidate.outputs.management }}
      feedback: ${{ steps.candidate.outputs.feedback }}
      harness: ${{ steps.candidate.outputs.harness }}
    env:
      PUFFER_MAINT_DEFER_PUBLISH: '1'
      PUFFER_MAINT_TASK: ${{ needs.observe.outputs.task }}
      ANNIE_PROVIDER_HOLDS: ${{ needs.observe.outputs.holds }}
      # Trusted rejection memory: review-rejected maintenance areas of the last 30 days, validated strictly by maintain.mjs.
      ANNIE_REJECTIONS: ${{ needs.observe.outputs.rejections }}
      # Sanitized incident digest for a harness repair task; untrusted data that reaches the model only via the intake file.
      ANNIE_INCIDENT: ${{ needs.observe.outputs.incident }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.observe.outputs.task).base }}
          fetch-depth: 0
          persist-credentials: false
      - run: bash tools/maintainer/ci.sh init
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - name: Ensure rootless container tools
        run: |
          if ! command -v podman; then
            sudo apt-get update
            sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          fi
          podman info
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - run: bash tools/maintainer/ci.sh prepare
      - name: Validate private Podman store before model runtime and credentials
        run: bash tools/maintainer/ci.sh preflight
      - name: Freeze prepaid lease before first provider dispatch
        env:
          ANNIE_LEASE_JSON: ${{ needs.observe.outputs.lease }}
        run: |
          node --input-type=module -e 'import {mkdir,writeFile} from "node:fs/promises"; import {dirname} from "node:path"; import {verifyLease} from "./tools/maintainer/controller.mjs"; const lease=verifyLease(JSON.parse(process.env.ANNIE_LEASE_JSON),{env:process.env,task:JSON.parse(process.env.PUFFER_MAINT_TASK)}); if(Date.now()>=lease.deadline-90000)throw Error("lease expired"); await mkdir(dirname(process.env.PUFFER_MAINT_LEASE),{recursive:true}); await writeFile(process.env.PUFFER_MAINT_LEASE,JSON.stringify(lease));'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: prepaid
        with:
          name: annie-lease-${{ github.run_id }}-1
          path: ${{ env.PUFFER_MAINT_LEASE }}
          if-no-files-found: error
          retention-days: 14
      - name: Verify immutable prepaid upload by ID and digest before models
        env:
          GH_TOKEN: ${{ github.token }}
          ANNIE_LEASE_ARTIFACT_ID: ${{ steps.prepaid.outputs.artifact-id }}
          ANNIE_LEASE_ARTIFACT_DIGEST: ${{ steps.prepaid.outputs.artifact-digest }}
        run: node tools/maintainer/controller.mjs verify-upload
      # Every pi-ai provider env name plus companions, one explicit secret each; unset secrets are empty and count as absent.
      # Regenerate the three identical blocks with `node tools/maintainer/report.mjs provider-env`; ci.test.mjs enforces the list.
      - name: Validate at least one configured model provider is available
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANT_LING_API_KEY: ${{ secrets.ANT_LING_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_DEPLOYMENT_NAME_MAP: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_MAP }}
          AZURE_OPENAI_RESOURCE_NAME: ${{ secrets.AZURE_OPENAI_RESOURCE_NAME }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_TOKEN_PLAN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_API_KEY }}
          QWEN_TOKEN_PLAN_CN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_CN_API_KEY }}
          RADIUS_API_KEY: ${{ secrets.RADIUS_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
          XIAOMI_TOKEN_PLAN_AMS_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_AMS_API_KEY }}
          XIAOMI_TOKEN_PLAN_CN_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_CN_API_KEY }}
          XIAOMI_TOKEN_PLAN_SGP_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_SGP_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_CODING_CN_API_KEY: ${{ secrets.ZAI_CODING_CN_API_KEY }}
        run: |
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {join} from "node:path"; import {createRuntime,heldProviders,selectModels} from "./tools/maintainer/maintain.mjs"; const dir=process.env.PI_CODING_AGENT_DIR; const {executor,reviewer}=await selectModels(JSON.parse(await readFile(join(dir,"settings.json"),"utf8")),await createRuntime(dir),heldProviders(process.env.ANNIE_PROVIDER_HOLDS)); console.log(JSON.stringify({executor,reviewer}));'
      - name: Maintain or review selected task
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANT_LING_API_KEY: ${{ secrets.ANT_LING_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_DEPLOYMENT_NAME_MAP: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_MAP }}
          AZURE_OPENAI_RESOURCE_NAME: ${{ secrets.AZURE_OPENAI_RESOURCE_NAME }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_TOKEN_PLAN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_API_KEY }}
          QWEN_TOKEN_PLAN_CN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_CN_API_KEY }}
          RADIUS_API_KEY: ${{ secrets.RADIUS_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
          XIAOMI_TOKEN_PLAN_AMS_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_AMS_API_KEY }}
          XIAOMI_TOKEN_PLAN_CN_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_CN_API_KEY }}
          XIAOMI_TOKEN_PLAN_SGP_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_SGP_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_CODING_CN_API_KEY: ${{ secrets.ZAI_CODING_CN_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/maintainer/run.sh
      - name: Export only approved candidates or valid rejection feedback
        id: candidate
        if: always()
        run: bash tools/maintainer/ci.sh export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (steps.candidate.outputs.candidate == 'true' || steps.candidate.outputs.management == 'true' || steps.candidate.outputs.feedback == 'true' || steps.candidate.outputs.harness == 'true')
        with:
          name: honest-annie-candidate-${{ github.run_id }}-1
          path: ${{ env.HONEST_ANNIE_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect sanitized maintenance report
        if: always()
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANT_LING_API_KEY: ${{ secrets.ANT_LING_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_DEPLOYMENT_NAME_MAP: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME_MAP }}
          AZURE_OPENAI_RESOURCE_NAME: ${{ secrets.AZURE_OPENAI_RESOURCE_NAME }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_TOKEN_PLAN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_API_KEY }}
          QWEN_TOKEN_PLAN_CN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_CN_API_KEY }}
          RADIUS_API_KEY: ${{ secrets.RADIUS_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
          XIAOMI_TOKEN_PLAN_AMS_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_AMS_API_KEY }}
          XIAOMI_TOKEN_PLAN_CN_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_CN_API_KEY }}
          XIAOMI_TOKEN_PLAN_SGP_API_KEY: ${{ secrets.XIAOMI_TOKEN_PLAN_SGP_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_CODING_CN_API_KEY: ${{ secrets.ZAI_CODING_CN_API_KEY }}
        run: |
          day=$(node -p 'JSON.parse(process.env.PUFFER_MAINT_TASK).day')
          node tools/maintainer/report.mjs collect --report "$PUFFER_MAINT_RESULT" --reportdir "$RUNNER_TEMP/honest-annie-report" --gate-events "$PUFFER_MAINT_STATE/runs/$day/gate-events.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: honest-annie-model-report-${{ github.run_id }}-1
          path: ${{ runner.temp }}/honest-annie-report/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Clean private Podman runroot
        if: always()
        run: bash tools/maintainer/ci.sh cleanup

  release:
    name: Annie effects (model-free)
    needs: [observe, maintain]
    if: >-
      always() && vars.HONEST_ANNIE_ENABLED == 'true' &&
      (needs.maintain.outputs.candidate == 'true' || needs.maintain.outputs.management == 'true' || needs.maintain.outputs.feedback == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: honest-annie-release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      PUFFER_MAINT_TASK: ${{ needs.observe.outputs.task }}
      PUFFER_MAINT_REGISTRY: registry.bugabinga.net/pufferpanel
      HONEST_ANNIE_ENABLED: ${{ vars.HONEST_ANNIE_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.observe.outputs.task).base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck effects enablement
        run: test "$HONEST_ANNIE_ENABLED" = true
      - run: bash tools/maintainer/ci.sh init
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - name: Ensure rootless container tools
        if: needs.maintain.outputs.candidate == 'true'
        run: |
          if ! command -v podman; then
            sudo apt-get update
            sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          fi
          podman info
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: honest-annie-candidate-${{ github.run_id }}-1
          path: ${{ env.HONEST_ANNIE_ARTIFACT }}
      - name: Verify candidate identity, immutable CI, and gate receipt
        if: needs.maintain.outputs.candidate == 'true'
        run: bash tools/maintainer/ci.sh import
      - name: Independently rerun fixed gates before release credentials
        if: needs.maintain.outputs.candidate == 'true'
        run: bash tools/maintainer/ci.sh gate
      - name: Persist source before registry auth
        id: push
        if: needs.maintain.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/maintainer/ci.sh push
      - name: Authenticate publisher only after source persistence
        if: needs.maintain.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash tools/maintainer/ci.sh registry-login
      - name: Publish immutable numbered image, verify, promote latest
        if: needs.maintain.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/maintainer/ci.sh publish
      # Best-effort management after publication: runs once source persisted, even when publication failed.
      - name: Validate approved management permission class without admin credentials
        id: management-policy
        if: >-
          !cancelled() && needs.maintain.outputs.management == 'true' &&
          (needs.maintain.outputs.candidate == 'true' && steps.push.outcome == 'success' ||
          needs.maintain.outputs.candidate != 'true' && success())
        run: bash tools/maintainer/ci.sh management-check
      - name: Apply ordinary reviewed management with native token only
        if: >-
          !cancelled() && steps.management-policy.outcome == 'success' &&
          steps.management-policy.outputs.adminAction != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/maintainer/ci.sh management
      - name: Apply explicitly reviewed enable-issues with isolated admin capability
        if: >-
          !cancelled() && steps.management-policy.outcome == 'success' &&
          steps.management-policy.outputs.adminAction == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANNIE_GH_TOKEN: ${{ secrets.ANNIE_GH_TOKEN }}
        run: bash tools/maintainer/ci.sh management
      - name: Host substantive rejection COMMENT at exact H
        if: needs.maintain.outputs.feedback == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/maintainer/ci.sh feedback
      - name: Collect sanitized release report and actual receipts
        if: always()
        run: |
          day=$(node -p 'JSON.parse(process.env.PUFFER_MAINT_TASK).day')
          node tools/maintainer/report.mjs collect --report "$HONEST_ANNIE_ARTIFACT/result.json" --reportdir "$RUNNER_TEMP/honest-annie-report" --gate-events "$PUFFER_MAINT_STATE/runs/$day/gate-events.jsonl" --source-receipt "$PUFFER_MAINT_STATE/runs/$day/source.ok" --action-receipts "$PUFFER_MAINT_STATE/runs/$day/action-receipts.json" --published "$PUFFER_MAINT_STATE/runs/$day/publish.ok"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: honest-annie-release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/honest-annie-report/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Clean private Podman runroot and registry auth
        if: always()
        run: bash tools/maintainer/ci.sh cleanup

  retry-effects:
    needs: observe
    if: needs.observe.outputs.retry != '' && vars.HONEST_ANNIE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - name: Retry only known model-free effects job, never rerun-all or rerun-failed
        env:
          GH_TOKEN: ${{ github.token }}
          HONEST_ANNIE_ENABLED: ${{ vars.HONEST_ANNIE_ENABLED }}
          ANNIE_RETRY: ${{ needs.observe.outputs.retry }}
        run: node tools/maintainer/controller.mjs retry

  # Model-free incident issues: native token, issues: write only, trusted trunk harness, observe output as sole input.
  incidents:
    name: Annie incidents (model-free)
    needs: observe
    if: >-
      github.repository == 'bugabinga/pufferpanel' && github.ref == 'refs/heads/trunk' &&
      vars.HONEST_ANNIE_ENABLED == 'true' && needs.observe.outputs.incidents != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - name: Create, update, reopen, or close one incident issue per fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          HONEST_ANNIE_ENABLED: ${{ vars.HONEST_ANNIE_ENABLED }}
          ANNIE_INCIDENTS: ${{ needs.observe.outputs.incidents }}
        run: node tools/maintainer/controller.mjs incidents

  # Harness self-repair candidates run their own tests here, on a fresh runner with no secrets and a read-only token,
  # never in the job that holds ANNIE_GH_TOKEN.
  harness-gate:
    name: Annie harness gate (model-free)
    needs: [observe, maintain]
    if: vars.HONEST_ANNIE_ENABLED == 'true' && needs.maintain.outputs.harness == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PUFFER_MAINT_TASK: ${{ needs.observe.outputs.task }}
      HONEST_ANNIE_ENABLED: ${{ vars.HONEST_ANNIE_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.observe.outputs.task).base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck effects enablement
        run: test "$HONEST_ANNIE_ENABLED" = true
      - run: bash tools/maintainer/ci.sh init
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: honest-annie-candidate-${{ github.run_id }}-1
          path: ${{ env.HONEST_ANNIE_ARTIFACT }}
      - name: Verify harness candidate identity, harness-only paths, and gate receipt
        run: bash tools/maintainer/ci.sh import
      - name: Independently rerun the harness gate without credentials
        run: bash tools/maintainer/ci.sh gate

  # Delivery as a PR for Oliver: plumbing-only bundle checks, never trunk, never candidate code, never a merge.
  # Same display name as release on purpose: the effects retry keys on it, and at most one of the two runs per task.
  harness-deliver:
    name: Annie effects (model-free)
    needs: [observe, maintain, harness-gate]
    if: >-
      always() && vars.HONEST_ANNIE_ENABLED == 'true' && needs.maintain.outputs.harness == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: honest-annie-release
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      PUFFER_MAINT_TASK: ${{ needs.observe.outputs.task }}
      HONEST_ANNIE_ENABLED: ${{ vars.HONEST_ANNIE_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.observe.outputs.task).base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck effects enablement
        run: test "$HONEST_ANNIE_ENABLED" = true
      - run: bash tools/maintainer/ci.sh init
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: honest-annie-candidate-${{ github.run_id }}-1
          path: ${{ env.HONEST_ANNIE_ARTIFACT }}
      - name: Push the reviewed fix to annie/harness/FP and open a PR for Oliver, never trunk
        id: deliver
        env:
          GH_TOKEN: ${{ github.token }}
          ANNIE_GH_TOKEN: ${{ secrets.ANNIE_GH_TOKEN }}
          ANNIE_HARNESS_GATE: ${{ needs.harness-gate.result }}
        run: bash tools/maintainer/ci.sh deliver
      # A report marks the record terminal, so it exists only once the outcome is visible as a PR or incident comment;
      # otherwise the record stays pending for the bounded effects retry and then becomes an abandoned-effects incident.
      - name: Collect sanitized harness delivery report and receipts
        id: collect
        if: always() && steps.deliver.outcome == 'success'
        run: |
          day=$(node -p 'JSON.parse(process.env.PUFFER_MAINT_TASK).day')
          node tools/maintainer/report.mjs collect --report "$HONEST_ANNIE_ARTIFACT/result.json" --reportdir "$RUNNER_TEMP/honest-annie-report" --action-receipts "$PUFFER_MAINT_STATE/runs/$day/action-receipts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.collect.outcome == 'success'
        with:
          name: honest-annie-release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/honest-annie-report/report.json
          if-no-files-found: error
          retention-days: 14

  republish:
    name: Annie republish (model-free)
    needs: [check, observe]
    if: >-
      github.repository == 'bugabinga/pufferpanel' && github.ref == 'refs/heads/trunk' &&
      vars.HONEST_ANNIE_ENABLED == 'true' && needs.observe.outputs.republish != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: honest-annie-release
    permissions:
      contents: read
    env:
      ANNIE_REPUBLISH: ${{ needs.observe.outputs.republish }}
      PUFFER_MAINT_REGISTRY: registry.bugabinga.net/pufferpanel
      HONEST_ANNIE_ENABLED: ${{ vars.HONEST_ANNIE_ENABLED }}
    steps:
      # Harness comes from the trusted current checkout; the release commit is only a detached worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck effects enablement
        run: test "$HONEST_ANNIE_ENABLED" = true
      - run: bash tools/maintainer/ci.sh init
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
      - name: Ensure rootless container tools
        run: |
          if ! command -v podman; then
            sudo apt-get update
            sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          fi
          podman info
      - run: npm ci --ignore-scripts
        working-directory: tools/maintainer
      - name: Verify persisted release commit, policy, and detached worktree
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/maintainer/republish.mjs verify
      - name: Independently rerun fixed gates on the release commit
        id: gate
        run: node tools/maintainer/republish.mjs gate
      - name: Authenticate publisher only after fresh gates
        id: login
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash tools/maintainer/ci.sh registry-login
      - name: Publish immutable numbered image, verify, promote latest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/maintainer/republish.mjs publish
      - name: Collect sanitized republish report
        if: always()
        env:
          ANNIE_REPUBLISH_STAGES: verify=${{ steps.verify.outcome }},gate=${{ steps.gate.outcome }},login=${{ steps.login.outcome }},publish=${{ steps.publish.outcome }}
        run: node tools/maintainer/republish.mjs report "$RUNNER_TEMP/honest-annie-republish-report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: honest-annie-republish-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/honest-annie-republish-report/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Clean private Podman runroot and registry auth
        if: always()
        run: bash tools/maintainer/ci.sh cleanup
